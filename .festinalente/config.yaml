# Festina Lente Config Schema
# ---------------------
# This file has exactly THREE top-level keys: name, directives, settings
#
# Directives Configuration:
# Each skill can load directives from .festinalente/directives/{name}.xml
# Directives are mandatory instructions that the LLM must follow.

name: ""

directives:
  festina-create:
    - git
    - design
  festina-scope:
    - git
    - coding
    - design
  festina-plan:
    - git
    - planning
    - coding
  festina-implement:
    - git
    - coding
  festina-save:
    - git
  festina-finalize:
    - git
    - coding
  festina-rework:
    - git
    - coding
  festina-delete:
    - git
  festina-quick:
    - git
    - design
    - coding
  festina-explore: []
  festina-overview: []
  festina-directive:
    - git
  festina-map-product:
    - git
  festina-map-engineering:
    - git
  festina-define-product:
    - git

settings:
  version: "2.0"
  idPrefix: ""
  idPadding: 3
  archiveOnComplete: false
