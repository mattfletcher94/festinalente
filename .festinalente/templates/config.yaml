# Festina Lente Config Schema
# ---------------------
# This file has exactly THREE top-level keys: name, directives, settings
#
# Directives Configuration:
# Each skill can load directives from .festinalente/directives/{name}.xml
# Directives are mandatory instructions that the LLM must follow.

name: ""

directives:
  festina-create: []
  festina-scope: []
  festina-plan: []
  festina-implement: []
  festina-save: []
  festina-finalize: []
  festina-rework: []
  festina-delete: []
  festina-quick: []
  festina-explore: []
  festina-overview: []
  festina-directive: []
  festina-map-product: []
  festina-map-engineering: []
  festina-define-product: []

settings:
  version: "2.0"
  idPrefix: ""
  idPadding: 3
  archiveOnComplete: false
