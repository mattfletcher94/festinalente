# Project Glossary
# ----------------
# Maps project-specific terms to their aliases for improved search.
# When searching for "sign in", also match docs tagged with "login".
#
# This file is:
# - Auto-populated during /festina-map-product and /festina-map-engineering
# - Editable by hand to add custom terms
# - Used by search scripts to expand queries
#
# Format:
#   terms:
#     - term: "canonical name"
#       aliases: ["synonym1", "synonym2"]
#       domain: "optional domain grouping"
#       definition: "optional brief definition"

version: 1
terms:
  # Workflow terms
  - term: 'festina-lente'
    aliases: ['festinalente', 'fl', 'spec-driven']
    domain: tasks
    definition: 'Spec-driven AI development framework with DAG architecture'
    auto_generated: true

  - term: 'task'
    aliases: ['ticket', 'item', 'work-item']
    domain: tasks
    definition: 'A unit of work tracked through the kanban workflow'
    auto_generated: true

  - term: 'workflow'
    aliases: ['pipeline', 'process', 'flow']
    domain: tasks
    definition: '6-column task progression from backlog to done'
    auto_generated: true

  - term: 'backlog'
    aliases: ['todo', 'unstarted', 'new']
    domain: tasks
    definition: 'Initial workflow column for tasks ready to be scoped'
    auto_generated: true

  - term: 'scoped'
    aliases: ['specified', 'defined', 'analyzed']
    domain: tasks
    definition: 'Workflow column for tasks with functional specification'
    auto_generated: true

  - term: 'planned'
    aliases: ['ready', 'designed', 'prepared']
    domain: tasks
    definition: 'Workflow column for tasks with implementation plan'
    auto_generated: true

  - term: 'in-progress'
    aliases: ['implementing', 'coding', 'wip']
    domain: tasks
    definition: 'Workflow column for tasks currently being implemented'
    auto_generated: true

  - term: 'finalize'
    aliases: ['check', 'verification', 'qa', 'quality-assurance', 'complete']
    domain: tasks
    definition: 'Workflow column for validation, documentation, and completion'
    auto_generated: true

  - term: 'discover'
    aliases: ['discovery', 'festina-discover', 'find-opportunities', 'ideation']
    domain: skills
    definition: 'Skill that spawns parallel lens agents to systematically surface feature opportunities'

  - term: 'lens'
    aliases: ['lens-agent', 'discovery-lens', 'perspective']
    domain: skills
    definition: 'A specialized agent in /festina-discover that analyzes the project from one perspective (User, Product, Engineering, or Backlog)'

  - term: 'rework'
    aliases: ['revision', 'redo', 'fix', 'review-feedback']
    domain: tasks
    definition: 'Returning a task from finalize to in-progress with a structured issue report'
    auto_generated: true

  - term: 'spec'
    aliases: ['specification', 'spec.xml', 'functional-spec']
    domain: tasks
    definition: 'Functional specification file with technical requirements'
    auto_generated: true

  - term: 'plan'
    aliases: ['implementation-plan', 'plan.xml', 'steps']
    domain: tasks
    definition: 'Implementation plan file with executable steps'
    auto_generated: true

  - term: 'affects'
    aliases: ['product-link', 'feature-link']
    domain: tasks
    definition: 'Task XML field linking to product documentation IDs'
    auto_generated: true

  # Skill/CLI terms
  - term: 'skill'
    aliases: ['command', 'slash-command', 'festina-command']
    domain: cli
    definition: 'Interactive Claude Code workflow invoked via /festina-{name}'
    auto_generated: true

  - term: 'directive'
    aliases: ['governance-rule', 'coding-directive', 'check-rule', 'custom-rule']
    domain: directives
    definition: 'XML file defining context principles, process rules, validation checks, and examples that customize skill behavior'
    auto_generated: true

  # Documentation terms
  - term: 'product docs'
    aliases: ['feature-docs', 'user-docs', 'product-documentation']
    domain: docs
    definition: 'Documentation describing user-facing features in .festinalente/product/'
    auto_generated: true

  - term: 'engineering docs'
    aliases: ['technical-docs', 'system-docs', 'patterns']
    domain: docs
    definition: 'Documentation describing systems, patterns, conventions in .festinalente/engineering/'
    auto_generated: true

  - term: 'tldr'
    aliases: ['summary', 'one-liner', 'brief']
    domain: docs
    definition: 'Single sentence summary field in documentation frontmatter'
    auto_generated: true

  - term: 'boundary'
    aliases: ['scope-limit', 'exclusion', 'does-not']
    domain: docs
    definition: 'Documentation field describing what a feature does NOT cover'
    auto_generated: true

  - term: 'stub doc'
    aliases: ['stub', 'placeholder-doc', 'draft']
    domain: docs
    definition: 'Minimal documentation created during task creation, completed later'
    auto_generated: true

  - term: 'context selection'
    aliases: ['doc-selection', 'context-loading', 'smart-context']
    domain: docs
    definition: 'Tiered retrieval of relevant documentation for implementation'
    auto_generated: true

  - term: 'tier'
    aliases: ['detail-level', 'verbosity', 'context-tier']
    domain: docs
    definition: 'Context detail level: minimal, standard, or full'
    auto_generated: true

  # Search terms
  - term: 'hybrid search'
    aliases: ['combined-search', 'fuzzy-search', 'doc-search']
    domain: docs
    definition: 'Search combining exact keyword matching with fuzzy search'
    auto_generated: true

  - term: 'glossary'
    aliases: ['terms', 'synonyms', 'aliases']
    domain: utilities
    definition: 'Project-specific term mappings for search expansion'
    auto_generated: true

  - term: 'query expansion'
    aliases: ['term-expansion', 'synonym-expansion']
    domain: utilities
    definition: 'Expanding search queries with glossary aliases'
    auto_generated: true

  # VSCode terms
  - term: 'codelens'
    aliases: ['inline-action', 'code-lens', 'lens']
    domain: vscode
    definition: 'VSCode inline action links displayed above task.xml content'
    auto_generated: true

  - term: 'treeview'
    aliases: ['tree-view', 'sidebar-view', 'task-view']
    domain: vscode
    definition: 'VSCode sidebar panel showing tasks grouped by status'
    auto_generated: true

  - term: 'file watcher'
    aliases: ['watcher', 'auto-refresh', 'file-monitor']
    domain: vscode
    definition: 'Monitors task files and refreshes UI on changes'
    auto_generated: true

  # Validation terms
  - term: 'xml validation'
    aliases: ['validate-xml', 'xml-syntax']
    domain: validation
    definition: 'Syntax validation for task.xml, spec.xml, plan.xml files'
    auto_generated: true

  - term: 'yaml validation'
    aliases: ['validate-yaml', 'frontmatter-validation']
    domain: validation
    definition: 'Syntax validation for documentation frontmatter'
    auto_generated: true

  - term: 'quality check'
    aliases: ['doc-quality', 'validate-docs', 'quality-audit']
    domain: validation
    definition: 'Documentation completeness validation with 8 criteria'
    auto_generated: true

  # Utility terms
  - term: 'next-id'
    aliases: ['id-generation', 'task-id', 'sequential-id']
    domain: utilities
    definition: 'Generates next available task ID with padding'
    auto_generated: true

  - term: 'datetime'
    aliases: ['timestamp', 'date-time', 'current-date']
    domain: utilities
    definition: 'Current timestamp in ISO and YYYY-MM-DD formats'
    auto_generated: true

  # Engineering architecture terms
  - term: 'dag'
    aliases: ['directed-acyclic-graph', 'dag-architecture', 'layered-architecture']
    domain: engineering
    definition: 'Directed Acyclic Graph architecture with orchestrator → capability → computer layers'
    auto_generated: true

  - term: 'capability'
    aliases: ['mechanism', 'io-layer', 'side-effect']
    domain: engineering
    definition: 'Component handling I/O and side effects (file system, terminal)'
    auto_generated: true

  - term: 'computer'
    aliases: ['pure-function', 'logic', 'computation']
    domain: engineering
    definition: 'VSCode extension component with pure functions, no side effects'
    auto_generated: true

  - term: 'orchestrator'
    aliases: ['coordinator', 'extension-entry', 'policy']
    domain: engineering
    definition: 'extension.ts that coordinates capabilities and computers'
    auto_generated: true

  - term: 'subagent'
    aliases: ['child-agent', 'spawned-agent', 'task-agent']
    domain: engineering
    definition: 'Fresh Claude instance spawned via Task tool for isolated task execution'

  - term: 'factory-di'
    aliases: ['factory-pattern', 'dependency-injection', 'di']
    domain: engineering
    definition: 'Factory functions that inject dependencies for testability'
    auto_generated: true

  - term: 'tagged-union'
    aliases: ['discriminated-union', 'result-type', 'error-union']
    domain: engineering
    definition: 'TypeScript pattern with error/success tags for CLI output'
    auto_generated: true

  - term: 'monorepo'
    aliases: ['workspace', 'multi-package', 'pnpm-workspace']
    domain: engineering
    definition: 'Single repository containing multiple packages (apps/)'
    auto_generated: true

  - term: 'dogfooding'
    aliases: ['self-hosting', 'eating-own-dogfood', 'using-own-product']
    domain: engineering
    definition: 'Using festina lente to build festina lente itself'

  - term: 'build-output'
    aliases: ['generated-file', 'compiled-output', 'built-file']
    domain: engineering
    definition: 'Files generated by build process - edit source in apps/festinalente/src/ instead'

  - term: 'turbo'
    aliases: ['turborepo', 'build-orchestration', 'task-runner']
    domain: engineering
    definition: 'Build system for monorepo task orchestration and caching'
    auto_generated: true

  - term: 'fuse'
    aliases: ['fuse.js', 'fuzzy-match', 'fuzzy-library']
    domain: engineering
    definition: 'JavaScript library for fuzzy searching'
    auto_generated: true

  # Distribution terms
  - term: 'github packages'
    aliases: ['npm.pkg.github.com', 'github npm', 'ghp']
    domain: distribution
    definition: "GitHub's package registry for npm-compatible distribution"

  - term: 'npx'
    aliases: ['npm exec', 'package runner']
    domain: distribution
    definition: 'npm command to execute packages without installing globally'

  # Documentation diagram terms
  - term: 'mermaid'
    aliases: ['mermaid-diagram', 'mermaid.js', 'diagram']
    domain: docs
    definition: 'Markdown-embedded diagramming syntax for flowcharts, sequences, etc.'
    auto_generated: true

  - term: 'flowchart'
    aliases: ['flow-diagram', 'process-diagram']
    domain: docs
    definition: 'Mermaid diagram type showing process flow with nodes and edges'
    auto_generated: true

  - term: 'sequence-diagram'
    aliases: ['sequenceDiagram', 'interaction-diagram']
    domain: docs
    definition: 'Mermaid diagram type showing message flow between components'
    auto_generated: true

  - term: 'state-diagram'
    aliases: ['stateDiagram', 'state-machine']
    domain: docs
    definition: 'Mermaid diagram type showing state transitions'
    auto_generated: true

  - term: 'class-diagram'
    aliases: ['classDiagram', 'uml-class']
    domain: docs
    definition: 'Mermaid diagram type showing class relationships and interfaces'
    auto_generated: true

  # Terms added 2026-03-23 (audit gap-fill)
  - term: 'contracts'
    aliases: ['precondition', 'postcondition', 'invariant', 'contract-test']
    domain: tasks
    definition: 'Spec.xml element defining preconditions, postconditions, and invariants that flow into plan.xml as contract verification tests'
    auto_generated: true

  - term: 'valid-phases'
    aliases: ['directive-phases', 'phase-tags']
    domain: validation
    definition: '18 recognized phase tags for directive rules (scope, plan, implement, finalize, etc.)'
    auto_generated: true

  - term: 'doc-quality-checks'
    aliases: ['quality-thresholds', 'doc-checks', 'validation-checks']
    domain: validation
    definition: '8 automated checks for documentation quality (tldr, summary, keywords, overview, examples, boundaries, length)'
    auto_generated: true

  - term: 'branded-type'
    aliases: ['nominal-type', 'opaque-type', 'type-brand']
    domain: engineering
    definition: 'TypeScript pattern using intersection with __brand to prevent mixing structurally similar types (e.g., TaskId vs ProjectId)'
    auto_generated: true

  - term: 'partial'
    aliases: ['handlebars-partial', 'template-partial', 'reusable-snippet']
    domain: engineering
    definition: 'Reusable Handlebars Markdown snippet included in skills via {{> name}} syntax'
    auto_generated: true

  - term: 'silent-fallback'
    aliases: ['build-fallback', 'compilation-fallback']
    domain: engineering
    definition: 'Content-build behavior where Handlebars compilation failure copies raw source to dist/ instead of failing the build'
    auto_generated: true

  - term: 'project-grouping'
    aliases: ['task-grouping', 'project-tasks', 'requirement-mapping']
    domain: tasks
    definition: 'Bidirectional relationship between project.xml tasks element and task.xml project-id attribute'
    auto_generated: true

  - term: 'project'
    aliases: ['mini-prd', 'project.xml', 'multi-task']
    domain: projects
    definition: 'Lightweight grouping layer that decomposes work into 2-5 vertically-sliced tasks with requirement traceability'
    auto_generated: true

  - term: 'requirement-traceability'
    aliases: ['R1-Rn', 'requirement-coverage', 'coverage-matrix']
    domain: projects
    definition: 'System ensuring every numbered requirement maps to at least one decomposed task'
    auto_generated: true

  - term: 'vertical-slice'
    aliases: ['vertical-slicing', 'end-to-end-slice']
    domain: projects
    definition: 'Task decomposition strategy where each task delivers complete end-to-end value rather than a horizontal layer'
    auto_generated: true

  - term: 'project-id'
    aliases: ['P-prefix', 'project-number']
    domain: projects
    definition: 'Project identifier in format P{3-digit}-{slug} (e.g., P001-user-authentication)'
    auto_generated: true
