# Kanban Config Schema
# ---------------------
# This file has exactly THREE top-level keys: name, directives, settings
#
# Directives Configuration:
# Each skill can load directives from .kanban/directives/{name}.xml
# Directives are mandatory instructions that the LLM must follow.

name: ""

directives:
  kanban-status: []
  kanban-create: []
  kanban-scope: []
  kanban-plan: []
  kanban-implement: []
  kanban-save: []
  kanban-check: []
  kanban-docs: []
  kanban-merge: []
  kanban-rework: []
  kanban-map-product: []
  kanban-define-product: []
  kanban-map-engineering: []
  kanban-view: []
  kanban-report-label: []
  kanban-report-task: []
  kanban-report-user: []

settings:
  version: "2.0"
  idPrefix: ""
  idPadding: 3
  archiveOnComplete: false
