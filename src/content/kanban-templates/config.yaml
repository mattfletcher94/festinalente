# Kanban Config Schema
# ---------------------
# This file has exactly THREE top-level keys: name, user-skills, settings
# DO NOT add any other top-level keys (no 'verification', 'hooks', 'checks', 'commands', etc.)
# The schema is fixed - only modify values within the existing structure.
#
# User Skills Resolution:
# Each skill name in the skills array resolves to .claude/skills/{name}/SKILL.md
# Example: "coding-standards" -> .claude/skills/coding-standards/SKILL.md
#
# To add skills to a command:
#   "kanban-verify":
#     skills:
#       - check-typescript
#       - check-tests

name: ""

user-skills:
  "kanban-status":
    skills:
  "kanban-create":
    skills:
  "kanban-refine":
    skills:
  "kanban-scope":
    skills:
  "kanban-plan":
    skills:
  "kanban-implement":
    skills:
  "kanban-save":
    skills:
  "kanban-verify":
    skills:
  "kanban-approve":
    skills:
  "kanban-docs":
    skills:
  "kanban-merge":
    skills:
  "kanban-rework":
    skills:
  "kanban-map-product":
    skills:
  "kanban-define-product":
    skills:

settings:
  version: "2.0"
  idPrefix: ""
  idPadding: 3
  archiveOnComplete: false
