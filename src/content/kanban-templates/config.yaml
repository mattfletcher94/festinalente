# Kanban Config Schema
# ---------------------
# This file has exactly THREE top-level keys: name, hooks, settings
#
# Hooks Configuration:
# Each hook can specify directives, product docs, and engineering docs.
# - directives: User-defined instructions from .kanban/directives/{name}/DIRECTIVE.md
# - product: Product doc IDs for context (e.g., "features/auth")
# - engineering: Engineering doc IDs for context (e.g., "patterns/validation")

name: ""

hooks:
  kanban-status:
    directives: []
    product: []
    engineering: []
  kanban-create:
    directives: []
    product: []
    engineering: []
  kanban-refine:
    directives: []
    product: []
    engineering: []
  kanban-scope:
    directives: []
    product: []
    engineering: []
  kanban-plan:
    directives: []
    product: []
    engineering: []
  kanban-implement:
    directives: []
    product: []
    engineering: []
  kanban-save:
    directives: []
    product: []
    engineering: []
  kanban-codecheck:
    directives: []
    product: []
    engineering: []
  kanban-approve:
    directives: []
    product: []
    engineering: []
  kanban-docs:
    directives: []
    product: []
    engineering: []
  kanban-merge:
    directives: []
    product: []
    engineering: []
  kanban-rework:
    directives: []
    product: []
    engineering: []
  kanban-map-product:
    directives: []
    product: []
    engineering: []
  kanban-define-product:
    directives: []
    product: []
    engineering: []
  kanban-map-engineering:
    directives: []
    product: []
    engineering: []
  kanban-view:
    directives: []
    product: []
    engineering: []
  kanban-report-label:
    directives: []
    product: []
    engineering: []
  kanban-report-task:
    directives: []
    product: []
    engineering: []
  kanban-report-user:
    directives: []
    product: []
    engineering: []

settings:
  version: "2.0"
  idPrefix: ""
  idPadding: 3
  archiveOnComplete: false
