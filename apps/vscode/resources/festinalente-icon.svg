<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Roman column/pillar - single outline path -->
  <!-- Layout: abacus (top slab) -> echinus (taper) -> shaft -> taper -> stylobate (base slab) -->
  <path
    d="M5,2.5 L19,2.5 L19,4.5 L17,4.5 L16,7 L16,17 L17,19.5 L19,19.5 L19,21.5 L5,21.5 L5,19.5 L7,19.5 L8,17 L8,7 L7,4.5 L5,4.5 Z"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Fluting lines on shaft - subtle vertical grooves -->
  <line x1="10.5" y1="8" x2="10.5" y2="16" stroke="currentColor" stroke-width="0.75" opacity="0.5"/>
  <line x1="13.5" y1="8" x2="13.5" y2="16" stroke="currentColor" stroke-width="0.75" opacity="0.5"/>
</svg>
